<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07070F">
<title>IronLog</title>
<style>
:root {
  --bg: #07070F;
  --surface: #0E0E1A;
  --card: #13131F;
  --card-border: rgba(255,255,255,0.07);
  --elevated: #1A1A28;
  --primary: #7C3AED;
  --primary-dim: rgba(124,58,237,0.18);
  --accent: #A78BFA;
  --text: #F0F0FF;
  --text-2: #8888AA;
  --text-3: #4A4A6A;
  --green: #22C55E;
  --green-dim: rgba(34,197,94,0.15);
  --red: #EF4444;
  --amber: #F59E0B;
  --blue: #3B82F6;
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
#root { height: 100%; display: flex; flex-direction: column; }
::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }
.app-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(7,7,15,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--card-border);
  padding: env(safe-area-inset-top) 16px 0;
  height: calc(56px + env(safe-area-inset-top));
  display: flex; align-items: flex-end; padding-bottom: 8px;
}
.header-inner { display: flex; align-items: center; width: 100%; gap: 8px; }
.header-title { font-size: 18px; font-weight: 700; flex: 1; }
.app-content {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  margin-top: calc(56px + env(safe-area-inset-top));
  margin-bottom: calc(64px + env(safe-area-inset-bottom));
  padding: 16px; -webkit-overflow-scrolling: touch;
}
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: rgba(14,14,26,0.94); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border-top: 1px solid var(--card-border);
  height: calc(64px + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  display: flex; align-items: stretch;
}
.nav-tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  border: none; background: none; color: var(--text-3); font-size: 10px; font-weight: 600;
  letter-spacing: 0.3px; cursor: pointer; transition: color 0.2s; padding: 8px 4px;
  -webkit-tap-highlight-color: transparent; text-transform: uppercase;
}
.nav-tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav-tab.active { color: var(--accent); }
.nav-tab.log-active { color: var(--primary); filter: drop-shadow(0 0 8px rgba(124,58,237,0.6)); }
.nav-tab.log-active svg { stroke: var(--accent); }
.card {
  background: var(--card); border: 1px solid var(--card-border); border-radius: 16px;
  padding: 16px; margin-bottom: 12px; animation: fadeInUp 0.25s ease;
}
.card-title { font-size: 14px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 12px; }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: none; border-radius: 12px; font-family: var(--font); font-weight: 600;
  cursor: pointer; transition: all 0.15s; -webkit-tap-highlight-color: transparent;
  min-height: 44px; padding: 0 16px; font-size: 14px;
}
.btn:active { transform: scale(0.96); }
.btn-primary { background: var(--primary); color: #fff; font-size: 15px; }
.btn-primary:active { background: #6D28D9; }
.btn-secondary { background: var(--elevated); color: var(--text); border: 1px solid var(--card-border); }
.btn-ghost { background: transparent; color: var(--accent); }
.btn-danger { background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid rgba(239,68,68,0.2); }
.btn-icon { width: 40px; height: 40px; padding: 0; border-radius: 10px; background: var(--elevated); color: var(--text-2); font-size: 18px; }
.btn-full { width: 100%; }
.btn-lg { min-height: 54px; font-size: 16px; border-radius: 14px; }
.input {
  width: 100%; background: var(--elevated); border: 1px solid var(--card-border);
  border-radius: 10px; color: var(--text); font-family: var(--font);
  font-size: 16px; padding: 12px 14px; outline: none; transition: border-color 0.2s;
}
.input:focus { border-color: var(--primary); }
.input::placeholder { color: var(--text-3); }
select.input { appearance: none; -webkit-appearance: none; }
.stepper { display: flex; align-items: center; }
.stepper-btn {
  width: 48px; height: 64px; border: none; background: var(--elevated); color: var(--text);
  font-size: 24px; cursor: pointer; border-radius: 12px; display: flex; align-items: center;
  justify-content: center; -webkit-tap-highlight-color: transparent; transition: background 0.15s; flex-shrink: 0;
}
.stepper-btn:active { background: var(--primary-dim); }
.stepper-val { flex: 1; text-align: center; font-size: 36px; font-weight: 700; color: var(--text); min-width: 80px; }
.stepper-unit { font-size: 14px; color: var(--text-2); font-weight: 400; }
.stepper-input {
  flex: 1; text-align: center; font-size: 36px; font-weight: 700; color: var(--text);
  background: var(--elevated); border: 1.5px solid var(--card-border); border-radius: 10px;
  padding: 8px 4px; outline: none; font-family: var(--font); width: 0; min-width: 0;
  -moz-appearance: textfield;
}
.stepper-input::-webkit-inner-spin-button, .stepper-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.stepper-input:focus { border-color: var(--primary); }
.stepper-unit-label { font-size: 13px; color: var(--text-2); font-weight: 500; text-align: center; margin-top: 6px; }
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: 0.3px; }
.toast-container {
  position: fixed; top: calc(env(safe-area-inset-top) + 64px); left: 50%; transform: translateX(-50%);
  z-index: 9999; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.toast {
  background: var(--elevated); border: 1px solid var(--card-border); border-radius: 24px;
  padding: 10px 20px; font-size: 14px; font-weight: 500; color: var(--text);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4); animation: toastIn 0.3s ease; white-space: nowrap;
}
.toast.success { border-color: rgba(34,197,94,0.3); color: var(--green); }
.toast.error { border-color: rgba(239,68,68,0.3); color: var(--red); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-8px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
.modal-backdrop {
  position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  display: flex; align-items: flex-end; animation: backdropIn 0.2s ease;
}
@keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
.modal-sheet {
  width: 100%; background: var(--surface); border-radius: 24px 24px 0 0;
  border-top: 1px solid var(--card-border); padding-bottom: env(safe-area-inset-bottom);
  max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s cubic-bezier(0.32,0.72,0,1);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--text-3); margin: 12px auto 0; }
.modal-header { display: flex; align-items: center; padding: 16px 20px 8px; gap: 12px; }
.modal-title { font-size: 18px; font-weight: 700; flex: 1; }
.modal-body { padding: 12px 20px 20px; }
.set-row-wrap { overflow: hidden; position: relative; border-radius: 10px; margin-bottom: 4px; }
.set-row-delete {
  position: absolute; right: 0; top: 0; bottom: 0; width: 80px; background: var(--red);
  display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; border-radius: 10px;
}
.set-row {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--elevated);
  border-radius: 10px; cursor: pointer; transition: transform 0.2s ease; position: relative; z-index: 1;
  min-height: 44px; user-select: none; -webkit-user-select: none;
}
.set-num { font-size: 12px; color: var(--text-3); font-weight: 600; min-width: 36px; }
.set-info { flex: 1; font-size: 14px; color: var(--text); }
.set-vol { font-size: 12px; color: var(--text-3); }
.ex-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
.ex-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.ex-card-name { font-size: 16px; font-weight: 700; flex: 1; }
.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 12px; text-align: center; }
.stat-val { font-size: 22px; font-weight: 800; color: var(--accent); line-height: 1; }
.stat-lbl { font-size: 11px; color: var(--text-2); margin-top: 4px; font-weight: 500; }
.chart-wrap { position: relative; width: 100%; height: 200px; }
.activity-row { display: flex; gap: 6px; margin-top: 8px; }
.activity-dot {
  flex: 1; height: 32px; border-radius: 6px; display: flex; flex-direction: column;
  align-items: center; justify-content: flex-end; padding-bottom: 4px;
}
.activity-dot-label { font-size: 10px; color: var(--text-3); font-weight: 500; }
.cat-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; }
.cat-tab {
  flex-shrink: 0; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--card-border);
  background: var(--elevated); color: var(--text-2); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.15s; -webkit-tap-highlight-color: transparent;
}
.cat-tab.active { background: var(--primary-dim); border-color: var(--primary); color: var(--accent); }
.ex-item {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--card);
  border: 1px solid var(--card-border); border-radius: 14px; margin-bottom: 8px; cursor: pointer;
  -webkit-tap-highlight-color: transparent; animation: fadeInUp 0.2s ease;
}
.ex-item-name { flex: 1; font-size: 15px; font-weight: 600; }
.fab {
  position: fixed; bottom: calc(76px + env(safe-area-inset-bottom)); right: 20px; z-index: 50;
  width: 56px; height: 56px; border-radius: 28px; background: var(--primary); color: #fff; border: none;
  font-size: 28px; cursor: pointer; box-shadow: 0 4px 24px rgba(124,58,237,0.5);
  display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; transition: all 0.15s;
}
.fab:active { transform: scale(0.93); }
.session-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; overflow: hidden; margin-bottom: 10px; animation: fadeInUp 0.2s ease; }
.session-card-header { display: flex; align-items: center; gap: 8px; padding: 14px 16px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.session-date { font-size: 16px; font-weight: 700; }
.session-meta { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.session-chevron { color: var(--text-3); transition: transform 0.2s; font-size: 18px; flex-shrink: 0; }
.session-chevron.open { transform: rotate(90deg); }
.session-body { padding: 0 16px 14px; border-top: 1px solid var(--card-border); }
.session-ex { padding: 10px 0; border-bottom: 1px solid var(--card-border); }
.session-ex:last-child { border-bottom: none; }
.session-ex-name { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.session-set-row { font-size: 13px; color: var(--text-2); padding: 2px 0; }
.pr-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.pr-ex { font-size: 14px; font-weight: 700; }
.pr-val { font-size: 12px; color: var(--accent); margin-top: 2px; }
.pr-date { font-size: 11px; color: var(--text-3); }
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 48px 24px; text-align: center; }
.empty-icon { font-size: 48px; opacity: 0.4; }
.empty-title { font-size: 18px; font-weight: 700; color: var(--text-2); }
.empty-sub { font-size: 14px; color: var(--text-3); }
.loader { display: flex; align-items: center; justify-content: center; height: 200px; }
.spinner { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--card-border); border-top-color: var(--primary); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.search-wrap { position: relative; margin-bottom: 12px; }
.search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--text-3); fill: none; stroke-width: 2; }
.search-input { padding-left: 36px; }
.divider { height: 1px; background: var(--card-border); margin: 12px 0; }
.section-label { font-size: 12px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.8px; padding: 8px 0 6px; }
.pr-stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.pr-stat { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 12px 10px; text-align: center; }
.pr-stat-val { font-size: 18px; font-weight: 800; color: var(--accent); }
.pr-stat-lbl { font-size: 10px; color: var(--text-2); margin-top: 3px; font-weight: 500; }
.resume-card {
  background: linear-gradient(135deg, rgba(124,58,237,0.2), rgba(124,58,237,0.05));
  border: 1px solid rgba(124,58,237,0.3); border-radius: 18px; padding: 18px; margin-bottom: 16px;
  display: flex; align-items: center; gap: 16px; cursor: pointer;
}
.resume-info { flex: 1; }
.resume-label { font-size: 12px; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.resume-title { font-size: 18px; font-weight: 800; margin-top: 4px; }
.add-ex-btn {
  width: 100%; min-height: 54px; background: var(--primary-dim); border: 1px dashed rgba(124,58,237,0.4);
  border-radius: 14px; color: var(--accent); font-size: 15px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  cursor: pointer; -webkit-tap-highlight-color: transparent; margin-top: 4px;
}
.settings-item {
  display: flex; align-items: center; gap: 14px; padding: 16px; background: var(--card);
  border: 1px solid var(--card-border); border-radius: 14px; cursor: pointer; margin-bottom: 8px;
  -webkit-tap-highlight-color: transparent; transition: background 0.15s;
}
.settings-item:active { background: var(--elevated); }
.settings-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.settings-item-info { flex: 1; }
.settings-item-title { font-size: 15px; font-weight: 600; }
.settings-item-sub { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.picker-group-label { font-size: 12px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.8px; padding: 12px 0 6px; }
.picker-item {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.15s; margin-bottom: 2px;
}
.picker-item:active { background: var(--elevated); }
.picker-item-name { font-size: 15px; font-weight: 600; flex: 1; }
.greeting { font-size: 26px; font-weight: 800; margin-bottom: 2px; }
.greeting-date { font-size: 14px; color: var(--text-2); margin-bottom: 20px; }
.ex-selector {
  display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--card-border);
  border-radius: 14px; padding: 12px 16px; cursor: pointer; margin-bottom: 16px; -webkit-tap-highlight-color: transparent;
}
.ex-selector-name { flex: 1; font-size: 16px; font-weight: 700; }
.recent-set-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--card-border); font-size: 14px; }
.recent-set-row:last-child { border-bottom: none; }
.recent-set-date { color: var(--text-2); flex: 1; font-size: 13px; }
.recent-set-val { font-weight: 600; }
.finish-btn {
  background: var(--green-dim); color: var(--green); border: 1px solid rgba(34,197,94,0.25);
  border-radius: 10px; padding: 6px 14px; font-size: 14px; font-weight: 700;
  cursor: pointer; -webkit-tap-highlight-color: transparent; white-space: nowrap;
}
.celebration { position: fixed; top: 40%; left: 50%; transform: translate(-50%,-50%); z-index: 9998; pointer-events: none; font-size: 72px; animation: celebrationPop 1.4s ease forwards; }
@keyframes celebrationPop {
  0% { opacity: 0; transform: translate(-50%,-50%) scale(0.3); }
  25% { opacity: 1; transform: translate(-50%,-50%) scale(1.3); }
  50% { transform: translate(-50%,-50%) scale(1); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%,-80%) scale(1); }
}
.confirm-icon { font-size: 40px; text-align: center; margin-bottom: 12px; }
.confirm-title { font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 8px; }
.confirm-sub { font-size: 14px; color: var(--text-2); text-align: center; margin-bottom: 20px; }
.confirm-btns { display: flex; gap: 10px; }
.confirm-btns .btn { flex: 1; }
</style>

<body>
<div id="root"><div class="loader"><div class="spinner"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script type="module">
import { h, render, createContext } from 'https://esm.sh/preact@10.22.0';
import { useState, useEffect, useRef, useCallback, useContext } from 'https://esm.sh/preact@10.22.0/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
const html = htm.bind(h);

// ===== DB =====
const DB_NAME = 'ironlog', DB_VER = 1;
let _db = null;
function openDB() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('categories')) db.createObjectStore('categories', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('exercises')) { const s = db.createObjectStore('exercises', { keyPath: 'id' }); s.createIndex('by_category', 'categoryId'); }
      if (!db.objectStoreNames.contains('sessions')) { const s = db.createObjectStore('sessions', { keyPath: 'id' }); s.createIndex('by_date', 'date'); }
      if (!db.objectStoreNames.contains('sets')) { const s = db.createObjectStore('sets', { keyPath: 'id' }); s.createIndex('by_session', 'sessionId'); s.createIndex('by_exercise', 'exerciseId'); }
    };
    req.onsuccess = e => { _db = e.target.result; res(_db); };
    req.onerror = () => rej(req.error);
  });
}
function getAll(store) {
  return openDB().then(db => new Promise((res, rej) => {
    const req = db.transaction(store, 'readonly').objectStore(store).getAll();
    req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error);
  }));
}
function putRecord(store, record) {
  return openDB().then(db => new Promise((res, rej) => {
    const req = db.transaction(store, 'readwrite').objectStore(store).put(record);
    req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error);
  }));
}
function deleteRecord(store, id) {
  return openDB().then(db => new Promise((res, rej) => {
    const req = db.transaction(store, 'readwrite').objectStore(store).delete(id);
    req.onsuccess = () => res(); req.onerror = () => rej(req.error);
  }));
}
function clearStore(store) {
  return openDB().then(db => new Promise((res, rej) => {
    const req = db.transaction(store, 'readwrite').objectStore(store).clear();
    req.onsuccess = () => res(); req.onerror = () => rej(req.error);
  }));
}

// ===== SEED =====
const UID = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const DEFAULT_CATS = [
  {id:'chest',name:'Chest',color:'#FF6B6B',order:0},{id:'back',name:'Back',color:'#4ECDC4',order:1},
  {id:'legs',name:'Legs',color:'#45B7D1',order:2},{id:'shoulders',name:'Shoulders',color:'#96CEB4',order:3},
  {id:'arms',name:'Arms',color:'#FFEAA7',order:4},{id:'core',name:'Core',color:'#DDA0DD',order:5},
];
const DEFAULT_EX = [
  {c:'chest',n:['Chest Press Machine','Incline Bench Press','Cable Fly','Push-up']},
  {c:'back',n:['Lat Pulldown','Seated Row','Deadlift','Pull-up','Cable Row']},
  {c:'legs',n:['Leg Press','Squat','Leg Extension','Leg Curl','Calf Raise']},
  {c:'shoulders',n:['Shoulder Press Machine','Lateral Raise','Front Raise','Face Pull']},
  {c:'arms',n:['Bicep Curl','Tricep Pushdown','Hammer Curl','Overhead Tricep Extension']},
  {c:'core',n:['Plank','Crunch','Russian Twist','Leg Raise']},
];
async function seedIfEmpty() {
  const cats = await getAll('categories');
  if (cats.length) return;
  for (const c of DEFAULT_CATS) await putRecord('categories', c);
  for (const g of DEFAULT_EX) for (const name of g.n) await putRecord('exercises', {id:UID(), name, categoryId:g.c, createdAt:Date.now()});
}

// ===== UTILS =====
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fmtW = w => w%1===0?`${w}`:`${w.toFixed(1)}`;
const calcVol = sets => sets.reduce((a,s)=>a+(s.weight*s.reps),0);
const greeting = () => { const h=new Date().getHours(); return h<12?'Good morning':h<18?'Good afternoon':'Good evening'; };
function fmtDateLabel(ds) {
  const t=todayStr(), d=new Date(); d.setDate(d.getDate()-1);
  const yd=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  if(ds===t) return 'Today'; if(ds===yd) return 'Yesterday';
  return new Date(ds+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function last7Days() {
  return Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));const s=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;return{date:s,label:['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()]};});
}
function getWeekStart() { const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());return d; }

// ===== CONTEXT =====
const Ctx = createContext({});

function AppProvider({children}) {
  const [tab, setTab] = useState('dashboard');
  const [categories, setCategories] = useState([]);
  const [exercises, setExercises] = useState([]);
  const [sessions, setSessions] = useState([]);
  const [sets, setSets] = useState([]);
  const [activeSession, setActiveSession] = useState(null);
  const [activeSets, setActiveSets] = useState([]);
  const [toast, setToast] = useState(null);
  const [loading, setLoading] = useState(true);
  const [celebration, setCelebration] = useState(false);
  const toastTimer = useRef(null);

  const showToast = useCallback((msg, type='success') => {
    if (toastTimer.current) clearTimeout(toastTimer.current);
    setToast({msg,type});
    toastTimer.current = setTimeout(()=>setToast(null), 2500);
  }, []);

  const showCelebration = useCallback(() => {
    setCelebration(true); setTimeout(()=>setCelebration(false),1600);
  }, []);

  const loadData = useCallback(async () => {
    const [cats, exs, sess, sts] = await Promise.all([getAll('categories'),getAll('exercises'),getAll('sessions'),getAll('sets')]);
    cats.sort((a,b)=>a.order-b.order);
    setCategories(cats); setExercises(exs);
    const sorted = sess.sort((a,b)=>b.date.localeCompare(a.date)||b.startTime-a.startTime);
    setSessions(sorted); setSets(sts);
    const today = todayStr();
    const active = sorted.find(s=>s.date===today&&!s.endTime);
    if (active) { setActiveSession(active); setActiveSets(sts.filter(s=>s.sessionId===active.id)); }
    else { setActiveSession(null); setActiveSets([]); }
    setLoading(false);
  }, []);

  useEffect(()=>{ seedIfEmpty().then(loadData); },[]);

  const startSession = useCallback(async () => {
    const session = {id:UID(), date:todayStr(), startTime:Date.now(), endTime:null};
    await putRecord('sessions', session);
    setActiveSession(session); setActiveSets([]);
    setSessions(prev=>[session,...prev]); setTab('log');
  }, [setTab]);

  const finishSession = useCallback(async () => {
    if (!activeSession) return;
    const updated = {...activeSession, endTime:Date.now()};
    await putRecord('sessions', updated);
    setActiveSession(null);
    setSessions(prev=>prev.map(s=>s.id===updated.id?updated:s));
    showToast('Workout saved! 💪'); setTab('history');
  }, [activeSession, showToast]);

  const setsRef = useRef(sets);
  useEffect(()=>{ setsRef.current = sets; },[sets]);

  const addSet = useCallback(async (exerciseId, weight, reps) => {
    if (!activeSession) return null;
    const curActiveSets = activeSets;
    const exSets = curActiveSets.filter(s=>s.exerciseId===exerciseId);
    const set = {id:UID(), sessionId:activeSession.id, exerciseId, weight, reps, setNumber:exSets.length+1, timestamp:Date.now()};
    await putRecord('sets', set);
    setActiveSets(prev=>[...prev,set]); setSets(prev=>[...prev,set]);
    const allPrev = setsRef.current.filter(s=>s.exerciseId===exerciseId&&s.sessionId!==activeSession.id);
    const prevMax = allPrev.reduce((m,s)=>Math.max(m,s.weight),0);
    if (weight>prevMax && prevMax>0) showCelebration();
    return set;
  }, [activeSession, activeSets, showCelebration]);

  const updateSet = useCallback(async (setId, weight, reps) => {
    const set = [...activeSets,...sets].find(s=>s.id===setId);
    if (!set) return;
    const updated = {...set,weight,reps};
    await putRecord('sets', updated);
    setActiveSets(prev=>prev.map(s=>s.id===setId?updated:s));
    setSets(prev=>prev.map(s=>s.id===setId?updated:s));
  }, [activeSets, sets]);

  const deleteSet = useCallback(async (setId) => {
    await deleteRecord('sets', setId);
    setActiveSets(prev=>prev.filter(s=>s.id!==setId));
    setSets(prev=>prev.filter(s=>s.id!==setId));
  }, []);

  const deleteSession = useCallback(async (sessionId) => {
    const sts = sets.filter(s=>s.sessionId===sessionId);
    for (const s of sts) await deleteRecord('sets', s.id);
    await deleteRecord('sessions', sessionId);
    setSessions(prev=>prev.filter(s=>s.id!==sessionId));
    setSets(prev=>prev.filter(s=>s.sessionId!==sessionId));
    if (activeSession?.id===sessionId) { setActiveSession(null); setActiveSets([]); }
    showToast('Session deleted');
  }, [sets, activeSession, showToast]);

  const addExercise = useCallback(async (name, categoryId) => {
    const ex = {id:UID(), name, categoryId, createdAt:Date.now()};
    await putRecord('exercises', ex); setExercises(prev=>[...prev,ex]); return ex;
  }, []);

  const updateExercise = useCallback(async (id, name) => {
    const ex = exercises.find(e=>e.id===id); if (!ex) return;
    const updated = {...ex,name}; await putRecord('exercises', updated);
    setExercises(prev=>prev.map(e=>e.id===id?updated:e));
  }, [exercises]);

  const deleteExercise = useCallback(async (id) => {
    await deleteRecord('exercises', id); setExercises(prev=>prev.filter(e=>e.id!==id));
    showToast('Exercise deleted');
  }, [showToast]);

  const exportData = useCallback(async () => {
    const data = {categories,exercises,sessions,sets,exportedAt:Date.now()};
    const url = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
    const a = document.createElement('a'); a.href=url; a.download=`ironlog-${todayStr()}.json`; a.click(); URL.revokeObjectURL(url);
    showToast('Data exported!');
  }, [categories,exercises,sessions,sets,showToast]);

  const importData = useCallback(async (file) => {
    const text = await file.text(); const data = JSON.parse(text);
    if (data.categories) for (const r of data.categories) await putRecord('categories', r);
    if (data.exercises) for (const r of data.exercises) await putRecord('exercises', r);
    if (data.sessions) for (const r of data.sessions) await putRecord('sessions', r);
    if (data.sets) for (const r of data.sets) await putRecord('sets', r);
    await loadData(); showToast('Data imported!');
  }, [loadData, showToast]);

  const clearAll = useCallback(async () => {
    await Promise.all(['categories','exercises','sessions','sets'].map(clearStore));
    setActiveSession(null); setActiveSets([]);
    await seedIfEmpty(); await loadData(); showToast('All data cleared');
  }, [loadData, showToast]);

  return html`<${Ctx.Provider} value=${{tab,setTab,categories,exercises,sessions,sets,activeSession,activeSets,loading,toast,showToast,celebration,startSession,finishSession,addSet,updateSet,deleteSet,deleteSession,addExercise,updateExercise,deleteExercise,exportData,importData,clearAll,loadData}}>${children}</${Ctx.Provider}>`;
}

// ===== EXERCISE FORM =====
function ExerciseFormModal({exercise, onClose}) {

// ===== SWIPE SET ROW =====
function SwipeSetRow({set, onEdit, onDelete, number}) {
  const [offset, setOffset] = useState(0);
  const startX = useRef(0);
  const moved = useRef(false);
  return html`
    <div class="set-row-wrap">
      <div class="set-row-delete" onClick=${onDelete}>Delete</div>
      <div class="set-row"
        style="transform:translateX(${offset}px)"
        onTouchStart=${e=>{startX.current=e.touches[0].clientX;moved.current=false;}}
        onTouchMove=${e=>{const dx=e.touches[0].clientX-startX.current;if(dx<0){moved.current=true;setOffset(Math.max(dx,-80));}}}
        onTouchEnd=${e=>{const dx=e.changedTouches[0].clientX-startX.current;if(dx<-50)setOffset(-80);else{setOffset(0);if(!moved.current)onEdit();}}}
        onClick=${()=>{if(offset===0)onEdit();}}>
        <span class="set-num">Set ${number}</span>
        <span class="set-info">${fmtW(set.weight)} kg × ${set.reps} reps</span>
        <span class="set-vol">${fmtW(set.weight*set.reps)} kg</span>
      </div>
    </div>`;
}

// ===== DASHBOARD =====
function Dashboard() {
  const {sessions,sets,exercises,categories,activeSession,setTab} = useContext(Ctx);

  const weekStart = getWeekStart();
  const weekSess = sessions.filter(s=>new Date(s.date+'T00:00:00')>=weekStart);
  const weekSets = sets.filter(s=>weekSess.some(ss=>ss.id===s.sessionId));
  const days7 = last7Days();
  const sessDates = new Set(sessions.map(s=>s.date));
  const today = new Date();
  const dateStr = today.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

  const exMap = Object.fromEntries(exercises.map(e=>[e.id,e]));
  const exMax = {};
  for (const s of [...sets].sort((a,b)=>a.timestamp-b.timestamp)) {
    if (!exMax[s.exerciseId]||s.weight>exMax[s.exerciseId].weight) exMax[s.exerciseId] = {...s};
  }
  const prs = Object.entries(exMax).map(([id,s])=>({ex:exMap[id],s})).filter(p=>p.ex&&p.s.weight>0)
    .sort((a,b)=>b.s.timestamp-a.s.timestamp).slice(0,3);
  const weekPRsCount = prs.filter(p=>{
    const sess = sessions.find(ss=>ss.id===p.s.sessionId);
    return sess && new Date(sess.date+'T00:00:00')>=weekStart;
  }).length;

  return html`<div>
    <div class="greeting">${greeting()}, champ 💪</div>
    <div class="greeting-date">${dateStr}</div>
    ${activeSession&&html`
      <div class="resume-card" onClick=${()=>setTab('log')}>
        <div style="font-size:28px">⚡</div>
        <div class="resume-info">
          <div class="resume-label">Active Session</div>
          <div class="resume-title">Continue Logging</div>
        </div>
        <svg style="width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:2" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    `}
    <div class="stats-row">
      <div class="stat-card"><div class="stat-val">${weekSess.length}</div><div class="stat-lbl">Sessions</div></div>
      <div class="stat-card"><div class="stat-val">${weekSets.length}</div><div class="stat-lbl">Total Sets</div></div>
      <div class="stat-card"><div class="stat-val">${weekPRsCount}</div><div class="stat-lbl">PRs</div></div>
    </div>
    <div class="card">
      <div class="card-title">Last 7 Days</div>
      <div class="activity-row">
        ${days7.map(d=>html`
          <div class="activity-dot" style="background:${sessDates.has(d.date)?'rgba(124,58,237,0.45)':'var(--elevated)'};border:1px solid ${sessDates.has(d.date)?'rgba(124,58,237,0.5)':'var(--card-border)'}">
            <span class="activity-dot-label">${d.label}</span>
          </div>`)}
      </div>
    </div>
    ${prs.length>0&&html`
      <div class="card-title" style="margin-top:4px">Recent PRs 🏆</div>
      ${prs.map(({ex,s})=>{
        const sess = sessions.find(ss=>ss.id===s.sessionId);
        const cat = categories.find(c=>c.id===ex.categoryId);
        return html`<div class="pr-card">
          <div style="font-size:20px">🥇</div>
          <div style="flex:1">
            <div class="pr-ex">${ex.name}</div>
            <div class="pr-val">${fmtW(s.weight)} kg × ${s.reps} reps</div>
          </div>
          ${cat&&html`<span class="badge" style="background:${cat.color}22;color:${cat.color}">${cat.name}</span>`}
          <div class="pr-date">${sess?fmtDateLabel(sess.date):''}</div>
        </div>`;
      })}
    `}
  </div>`;
}

// ===== LOG WORKOUT =====
function LogWorkout() {
  const {activeSession,activeSets,addSet,updateSet,deleteSet,finishSession,exercises,categories,showToast,sessions,sets:allSets} = useContext(Ctx);
  const [showPicker, setShowPicker] = useState(false);
  const [editingSet, setEditingSet] = useState(null);

  const exInSession = [];
  const seen = new Set();
  for (const s of activeSets) { if (!seen.has(s.exerciseId)) { seen.add(s.exerciseId); exInSession.push(s.exerciseId); } }

  const handlePickExercise = async ex => {
    if (!seen.has(ex.id)) await addSet(ex.id, 20, 10);
    else showToast('Exercise already added');
  };

  const handleAddSet = async exId => {
    const exSets = activeSets.filter(s=>s.exerciseId===exId);
    const last = exSets[exSets.length-1];
    await addSet(exId, last?last.weight:20, last?last.reps:10);
  };

  return html`<div>
    ${exInSession.length===0&&html`<div class="empty-state"><div class="empty-icon">➕</div><div class="empty-title">Add your first exercise</div><div class="empty-sub">Tap the button below to get started</div></div>`}
    ${exInSession.map(exId=>{
      const ex = exercises.find(e=>e.id===exId); if (!ex) return null;
      const cat = categories.find(c=>c.id===ex.categoryId);
      const exSets = activeSets.filter(s=>s.exerciseId===exId);
      return html`<div class="ex-card" key=${exId}>
        <div class="ex-card-header">
          ${cat&&html`<span class="badge" style="background:${cat.color}22;color:${cat.color}">${cat.name}</span>`}
          <span class="ex-card-name">${ex.name}</span>
        </div>
        ${exSets.map((s,i)=>html`<${SwipeSetRow} key=${s.id} set=${s} number=${i+1}
          onEdit=${()=>setEditingSet(s)} onDelete=${()=>deleteSet(s.id)} />`)}
        <button class="btn btn-ghost btn-full" style="margin-top:8px;background:var(--primary-dim);color:var(--accent)"
          onClick=${()=>handleAddSet(exId)}>+ Add Set</button>
      </div>`;
    })}
    <button class="add-ex-btn" onClick=${()=>setShowPicker(true)}><span style="font-size:20px">＋</span> Add Exercise</button>
    ${showPicker&&html`<${ExercisePickerModal} onSelect=${handlePickExercise} onClose=${()=>setShowPicker(false)} />`}
    ${editingSet&&html`<${SetEditorModal} set=${editingSet} onSave=${(w,r)=>updateSet(editingSet.id,w,r)} onClose=${()=>setEditingSet(null)} />`}
  </div>`;
}

// ===== HISTORY =====
function History() {
  const {sessions,sets,exercises,deleteSession} = useContext(Ctx);
  const [expanded, setExpanded] = useState({});
  const [confirmDel, setConfirmDel] = useState(null);
  const completed = sessions.filter(s=>s.endTime);
  if (!completed.length) return html`<div class="empty-state"><div class="empty-icon">📅</div><div class="empty-title">No workouts yet</div><div class="empty-sub">Complete a workout to see your history</div></div>`;
  return html`<div>
    ${completed.map(session=>{
      const sts = sets.filter(s=>s.sessionId===session.id);
      const exIds = [...new Set(sts.map(s=>s.exerciseId))];
      const vol = calcVol(sts);
      const dur = Math.floor((session.endTime-session.startTime)/60000);
      const isExp = expanded[session.id];
      return html`<div class="session-card" key=${session.id}>
          <div class="session-card-header" onClick=${()=>setExpanded(p=>({...p,[session.id]:!p[session.id]}))}>
            <div style="flex:1">
              <div class="session-date">${fmtDateLabel(session.date)}</div>
              <div class="session-meta">${exIds.length} exercises · ${sts.length} sets · ${fmtW(vol)} kg · ${dur}min</div>
            </div>
            <button class="btn btn-icon" style="background:rgba(239,68,68,0.12);color:var(--red);width:34px;height:34px;font-size:14px;border-radius:8px;flex-shrink:0;margin-right:6px"
              onClick=${e=>{e.stopPropagation();setConfirmDel(session.id);}}>🗑️</button>
            <div class="session-chevron ${isExp?'open':''}">›</div>
          </div>
        ${isExp&&html`<div class="session-body">
          ${exIds.map(exId=>{
            const ex=exercises.find(e=>e.id===exId);
            const exSets=sts.filter(s=>s.exerciseId===exId);
            return html`<div class="session-ex" key=${exId}>
              <div class="session-ex-name">${ex?.name||'Unknown'}</div>
              ${exSets.map((s,i)=>html`<div class="session-set-row">Set ${i+1}: ${fmtW(s.weight)} kg × ${s.reps} reps</div>`)}
            </div>`;
          })}
        </div>`}
      </div>`;
    })}
    ${confirmDel&&html`<${ConfirmModal} title="Delete Session" subtitle="This will permanently delete this workout and all its sets." onConfirm=${()=>deleteSession(confirmDel)} onClose=${()=>setConfirmDel(null)} />`}
  </div>`;
}

// ===== PROGRESS =====
function Progress() {
  const {exercises,sets,categories} = useContext(Ctx);
  const [selExId, setSelExId] = useState(null);
  const [showPicker, setShowPicker] = useState(false);
  const wRef = useRef(null), vRef = useRef(null);
  const wChart = useRef(null), vChart = useRef(null);

  useEffect(()=>{
    if (selExId||!sets.length||!exercises.length) return;
    const latest = sets.reduce((b,s)=>(!b||s.timestamp>b.timestamp)?s:b,null);
    if (latest) setSelExId(latest.exerciseId);
  },[exercises,sets]);

  const selEx = exercises.find(e=>e.id===selExId);
  const exSets = sets.filter(s=>s.exerciseId===selExId);
  const byDate = {};
  for (const s of exSets) {
    const d = s.timestamp?new Date(s.timestamp).toISOString().slice(0,10):'?';
    if (!byDate[d]) byDate[d]=[];
    byDate[d].push(s);
  }
  const dates = Object.keys(byDate).sort();
  const maxWts = dates.map(d=>Math.max(...byDate[d].map(s=>s.weight)));
  const vols = dates.map(d=>calcVol(byDate[d]));
  const allMax = exSets.reduce((m,s)=>Math.max(m,s.weight),0);
  const maxReps = exSets.filter(s=>s.weight===allMax).reduce((m,s)=>Math.max(m,s.reps),0);
  const bestVol = vols.length?Math.max(...vols):0;
  const cat = categories.find(c=>c.id===selEx?.categoryId);

  useEffect(()=>{
    if (!selExId||!dates.length) return;
    const labels = dates.map(d=>{const[,m,dd]=d.split('-');return`${m}/${dd}`;});
    if (wChart.current) {wChart.current.destroy();wChart.current=null;}
    if (wRef.current) wChart.current = new Chart(wRef.current,{type:'line',data:{labels,datasets:[{label:'Max Weight (kg)',data:maxWts,borderColor:'#7C3AED',backgroundColor:'rgba(124,58,237,0.15)',fill:true,tension:0.4,pointBackgroundColor:'#A78BFA',pointRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8888AA',font:{size:11}},grid:{color:'rgba(255,255,255,0.05)'}},y:{ticks:{color:'#8888AA',font:{size:11}},grid:{color:'rgba(255,255,255,0.05)'}}}}});
    if (vChart.current) {vChart.current.destroy();vChart.current=null;}
    if (vRef.current) vChart.current = new Chart(vRef.current,{type:'bar',data:{labels,datasets:[{label:'Volume (kg)',data:vols,backgroundColor:'rgba(124,58,237,0.6)',borderColor:'#7C3AED',borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8888AA',font:{size:11}},grid:{color:'rgba(255,255,255,0.05)'}},y:{ticks:{color:'#8888AA',font:{size:11}},grid:{color:'rgba(255,255,255,0.05)'}}}}});
    return ()=>{if(wChart.current){wChart.current.destroy();wChart.current=null;}if(vChart.current){vChart.current.destroy();vChart.current=null;}};
  },[selExId,sets]);

  const recentSets = [...exSets].sort((a,b)=>b.timestamp-a.timestamp).slice(0,10);

  return html`<div>
    <div class="ex-selector" onClick=${()=>setShowPicker(true)}>
      ${cat&&html`<span class="badge" style="background:${cat.color}22;color:${cat.color}">${cat.name}</span>`}
      <span class="ex-selector-name">${selEx?selEx.name:'Select exercise...'}</span>
      <svg style="width:18px;height:18px;stroke:var(--text-2);fill:none;stroke-width:2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    ${showPicker&&html`<${ExercisePickerModal} onSelect=${ex=>{setSelExId(ex.id);}} onClose=${()=>setShowPicker(false)} />`}
    ${!selEx&&html`<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-title">Pick an exercise</div><div class="empty-sub">Select above to view progress charts</div></div>`}
    ${selEx&&!exSets.length&&html`<div class="empty-state"><div class="empty-icon">📈</div><div class="empty-title">No data yet</div><div class="empty-sub">Log some sets for ${selEx.name} to see progress</div></div>`}
    ${selEx&&exSets.length>0&&html`
      <div class="pr-stats-row">
        <div class="pr-stat"><div class="pr-stat-val">${fmtW(allMax)}</div><div class="pr-stat-lbl">Max Weight kg</div></div>
        <div class="pr-stat"><div class="pr-stat-val">${maxReps}</div><div class="pr-stat-lbl">Reps at Max</div></div>
        <div class="pr-stat"><div class="pr-stat-val">${fmtW(bestVol)}</div><div class="pr-stat-lbl">Best Vol kg</div></div>
      </div>
      <div class="card"><div class="card-title">Weight Progression</div><div class="chart-wrap"><canvas ref=${wRef}></canvas></div></div>
      <div class="card"><div class="card-title">Volume Progression</div><div class="chart-wrap"><canvas ref=${vRef}></canvas></div></div>
      <div class="card">
        <div class="card-title">Recent Sets</div>
        ${recentSets.map(s=>html`<div class="recent-set-row">
          <span class="recent-set-date">${new Date(s.timestamp).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span>
          <span class="recent-set-val">Set ${s.setNumber} · ${fmtW(s.weight)} kg × ${s.reps} reps</span>
        </div>`)}
      </div>
    `}
  </div>`;
}

// ===== EXERCISES =====
function Exercises() {
  const {categories,exercises,deleteExercise,setTab} = useContext(Ctx);
  const [activeCat, setActiveCat] = useState('all');
  const [showAdd, setShowAdd] = useState(false);
  const [editEx, setEditEx] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const [ctxEx, setCtxEx] = useState(null);
  const filtered = (activeCat==='all'?exercises:exercises.filter(e=>e.categoryId===activeCat)).sort((a,b)=>a.name.localeCompare(b.name));
  return html`<div>
    <div class="cat-tabs">
      <button class="cat-tab ${activeCat==='all'?'active':''}" onClick=${()=>setActiveCat('all')}>All</button>
      ${categories.map(c=>html`<button class="cat-tab ${activeCat===c.id?'active':''}" key=${c.id}
        style="${activeCat===c.id?`background:${c.color}22;border-color:${c.color};color:${c.color}`:''}"
        onClick=${()=>setActiveCat(c.id)}>${c.name}</button>`)}
    </div>
    ${filtered.map(ex=>{
      const cat=categories.find(c=>c.id===ex.categoryId);
      return html`<div class="ex-item" key=${ex.id} onClick=${()=>setCtxEx(ex)}>
        ${cat&&html`<span class="badge" style="background:${cat.color}22;color:${cat.color}">${cat.name}</span>`}
        <span class="ex-item-name">${ex.name}</span>
        <svg style="width:16px;height:16px;stroke:var(--text-3);fill:none;stroke-width:2.5" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1" fill="var(--text-3)"/><circle cx="12" cy="12" r="1" fill="var(--text-3)"/><circle cx="12" cy="19" r="1" fill="var(--text-3)"/></svg>
      </div>`;
    })}
    ${!filtered.length&&html`<div class="empty-state"><div class="empty-icon">🏋️</div><div class="empty-title">No exercises</div><div class="empty-sub">Tap + to add your first exercise</div></div>`}
    <button class="fab" onClick=${()=>setShowAdd(true)}>+</button>
    ${showAdd&&html`<${ExerciseFormModal} onClose=${()=>setShowAdd(false)} />`}
    ${editEx&&html`<${ExerciseFormModal} exercise=${editEx} onClose=${()=>setEditEx(null)} />`}
    ${ctxEx&&html`<${Modal} onClose=${()=>setCtxEx(null)} title=${ctxEx.name}>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn btn-secondary btn-full" style="justify-content:flex-start;gap:12px" onClick=${()=>{setTab('progress');setCtxEx(null);}}>📊 View Progress</button>
        <button class="btn btn-secondary btn-full" style="justify-content:flex-start;gap:12px" onClick=${()=>{setEditEx(ctxEx);setCtxEx(null);}}>✏️ Edit Name</button>
        <button class="btn btn-danger btn-full" style="justify-content:flex-start;gap:12px" onClick=${()=>{setConfirmDel(ctxEx);setCtxEx(null);}}>🗑️ Delete Exercise</button>
      </div>
    </${Modal}>`}
    ${confirmDel&&html`<${ConfirmModal} title="Delete Exercise" subtitle=${'Delete "'+confirmDel.name+'"? Historical sets are kept.'} onConfirm=${()=>deleteExercise(confirmDel.id)} onClose=${()=>setConfirmDel(null)} />`}
  </div>`;
}

// ===== SETTINGS =====
function Settings({onClose}) {
  const {exportData,importData,clearAll} = useContext(Ctx);
  const [showClear, setShowClear] = useState(false);
  const [clearVal, setClearVal] = useState('');
  const fileRef = useRef(null);
  return html`<${Modal} onClose=${onClose} title="Settings">
    <div class="settings-item" onClick=${exportData}>
      <div class="settings-icon" style="background:rgba(59,130,246,0.15)">📤</div>
      <div class="settings-item-info"><div class="settings-item-title">Export Data</div><div class="settings-item-sub">Download all data as JSON</div></div>
    </div>
    <div class="settings-item" onClick=${()=>fileRef.current?.click()}>
      <div class="settings-icon" style="background:rgba(34,197,94,0.15)">📥</div>
      <div class="settings-item-info"><div class="settings-item-title">Import Data</div><div class="settings-item-sub">Merge from JSON backup</div></div>
    </div>
    <input type="file" accept=".json" ref=${fileRef} style="display:none" onChange=${e=>{if(e.target.files[0])importData(e.target.files[0]);}} />
    <div class="settings-item" style="border-color:rgba(239,68,68,0.2)" onClick=${()=>setShowClear(true)}>
      <div class="settings-icon" style="background:rgba(239,68,68,0.15)">🗑️</div>
      <div class="settings-item-info"><div class="settings-item-title" style="color:var(--red)">Clear All Data</div><div class="settings-item-sub">Permanently delete everything</div></div>
    </div>
    ${showClear&&html`<div style="margin-top:16px;padding:16px;background:var(--card);border-radius:14px;border:1px solid rgba(239,68,68,0.2)">
      <div style="color:var(--red);font-weight:700;margin-bottom:8px">⚠️ Type DELETE to confirm</div>
      <input class="input" placeholder="DELETE" value=${clearVal} onInput=${e=>setClearVal(e.target.value)} style="margin-bottom:10px" />
      <div style="display:flex;gap:8px">
        <button class="btn btn-secondary" style="flex:1" onClick=${()=>{setShowClear(false);setClearVal('');}}>Cancel</button>
        <button class="btn btn-danger" style="flex:1;${clearVal!=='DELETE'?'opacity:0.4':''}" disabled=${clearVal!=='DELETE'} onClick=${()=>{if(clearVal==='DELETE'){clearAll();setShowClear(false);onClose();}}}>Clear All</button>
      </div>
    </div>`}
    <div style="margin-top:20px;text-align:center;color:var(--text-3);font-size:12px">IronLog v1.0 · Data stays on your device</div>
  </${Modal}>`;
}

// ===== BOTTOM NAV =====
function BottomNav() {
  const {tab,setTab,activeSession,startSession} = useContext(Ctx);
  const tabs = [
    {id:'dashboard',label:'Home',icon:html`<svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`},
    {id:'log',label:'Log',icon:html`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>`},
    {id:'history',label:'History',icon:html`<svg viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`},
    {id:'progress',label:'Progress',icon:html`<svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`},
    {id:'exercises',label:'Exercises',icon:html`<svg viewBox="0 0 24 24"><path d="M6.5 6.5h11M6.5 12h11M6.5 17.5h11M3 6.5h.01M3 12h.01M3 17.5h.01"/></svg>`},
  ];
  const handleTab = (id) => {
    if (id === 'log' && !activeSession) startSession();
    else setTab(id);
  };
  return html`<nav class="bottom-nav">
    ${tabs.map(t=>html`
      <button class="nav-tab ${tab===t.id?'active':''} ${t.id==='log'&&activeSession?'log-active':''}" key=${t.id} onClick=${()=>handleTab(t.id)}>
        ${t.icon}${t.label}
      </button>`)}
  </nav>`;
}

// ===== HEADER =====
function Header() {
  const {tab,activeSession,finishSession} = useContext(Ctx);
  const [showSettings, setShowSettings] = useState(false);
  const titles={dashboard:'IronLog',log:'Log Workout',history:'History',progress:'Progress',exercises:'Exercises'};
  return html`<header class="app-header">
    <div class="header-inner">
      <div class="header-title">${titles[tab]||'IronLog'}</div>
      ${tab==='log'&&activeSession&&html`
        <button class="finish-btn" onClick=${finishSession}>Save</button>
      `}
      ${(tab==='dashboard'||tab==='exercises')&&html`<button class="btn btn-icon" onClick=${()=>setShowSettings(true)}>⚙️</button>`}
    </div>
    ${showSettings&&html`<${Settings} onClose=${()=>setShowSettings(false)} />`}
  </header>`;
}

// ===== APP =====
function App() {
  const {tab,loading} = useContext(Ctx);
  if (loading) return html`<div class="loader"><div class="spinner"></div></div>`;
  const screens = {dashboard:Dashboard,log:LogWorkout,history:History,progress:Progress,exercises:Exercises};
  const Screen = screens[tab]||Dashboard;
  return html`<div style="height:100%;display:flex;flex-direction:column">
    <${Header} />
    <${Toast} />
    <${Celebration} />
    <main class="app-content"><${Screen} /></main>
    <${BottomNav} />
  </div>`;
}

render(html`<${AppProvider}><${App} /></${AppProvider}>`, document.getElementById('root'));

(function(){

  const murl=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
  const lnk=document.createElement('link');lnk.rel='manifest';lnk.href=murl;document.head.appendChild(lnk);
  if('serviceWorker' in navigator){
    const sw=`const C='ironlog-v1';self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(['/'])));self.skipWaiting();});self.addEventListener('activate',e=>{e.waitUntil(clients.claim());});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{if(res.ok&&e.request.method==='GET'){const cl=res.clone();caches.open(C).then(c=>c.put(e.request,cl));}return res;}).catch(()=>caches.match('/')||new Response('Offline'))));});`;
    navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))).catch(()=>{});
  }
})();
